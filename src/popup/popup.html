<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BtrKorone</title>
  <link rel="stylesheet" href="daisyui.min.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Top Section: Logo Left + Account Card Right -->
    <header class="popup-header">
      <!-- Left: Logo + Settings + Quick Actions -->
      <div class="logo-column">
        <img src="../icons/icon128.png" alt="BtrKorone" class="logo-img">
        <h1 class="logo-title">Settings</h1>
        <div class="quick-actions">
          <button class="link-btn" id="btn-reload">
            <span class="link-icon">&#x21bb;</span> Reload Extension
          </button>
          <button class="link-btn link-btn-danger" id="btn-clear-cache">
            <span class="link-icon">&#x21bb;</span> Clear Extension Cache
          </button>
        </div>
      </div>

      <!-- Right: Account Card with Avatars + Action Buttons -->
      <div class="account-card">
        <div class="avatars-row">
          <div class="avatar-block">
            <div class="avatar-img-wrap">
              <img src="../icons/icon32.png" alt="User Avatar" id="user-avatar">
            </div>
            <span class="avatar-label" id="user-name">Not linked</span>
          </div>
          <div class="avatar-block">
            <div class="avatar-img-wrap">
              <img src="../icons/tier-free.png" alt="BtrKorone" id="tier-avatar" onerror="this.src='../icons/icon32.png'">
            </div>
            <span class="avatar-label" id="tier-label">BtrKorone Free</span>
          </div>
        </div>
        <div class="action-grid">
          <button class="action-btn action-blue" id="btn-manage">Manage<br>Subscription</button>
          <button class="action-btn action-green" id="btn-activate">Activate<br>Subscription</button>
          <button class="action-btn action-blue" id="btn-support">Support</button>
          <button class="action-btn action-blue" id="btn-discord">
            <span class="action-icon">&#x1F4AC;</span> Discord
          </button>
          <button class="action-btn action-blue" id="btn-bug">
            <span class="action-icon">&#x1F41B;</span> Bug<br>Report
          </button>
          <button class="action-btn action-blue" id="btn-feature">Feature<br>Request</button>
        </div>
      </div>
    </header>

    <!-- Tier Tabs -->
    <nav class="tier-tabs">
      <button class="tier-tab tier-tab-active" data-tier-tab="free">
        <img src="../icons/tier-free.png" class="tab-icon" onerror="this.src='../icons/icon32.png'"> BtrKorone Free
      </button>
      <button class="tier-tab" data-tier-tab="plus">
        <img src="../icons/tier-plus.png" class="tab-icon" onerror="this.src='../icons/icon32.png'"> BtrKorone Plus
      </button>
      <button class="tier-tab" data-tier-tab="rex">
        <img src="../icons/tier-rex.png" class="tab-icon" onerror="this.src='../icons/icon32.png'"> BtrKorone Rex
      </button>
    </nav>

    <!-- Features Panel -->
    <section class="features-panel">
      <div class="tier-content active" id="tier-free">
        <h2 class="panel-heading">General Features</h2>
        <div class="features-rows" id="free-features"></div>
      </div>
      <div class="tier-content" id="tier-plus">
        <h2 class="panel-heading">Plus Features</h2>
        <div class="features-rows" id="plus-features"></div>
      </div>
      <div class="tier-content" id="tier-rex">
        <h2 class="panel-heading">Rex Features</h2>
        <div class="features-rows" id="rex-features"></div>
      </div>
    </section>

    <!-- Verification Modal (hidden by default) -->
    <div class="modal-overlay" id="verify-modal" style="display:none;">
      <div class="modal-content">
        <h2 class="modal-title">Link & Verify Your Account</h2>
        <p class="modal-help">Enter your Korone User ID, generate a token, paste it into your <strong>Korone About Me</strong>, then verify.</p>

        <label class="modal-label">Korone User ID</label>
        <input type="text" id="input-userid" placeholder="e.g. 42770" class="modal-input">

        <button class="modal-btn modal-btn-primary" id="btn-generate-token">Generate Verification Token</button>

        <div class="token-display" id="token-display" style="display:none;">
          <p class="modal-help">Paste this into your <strong>Korone About Me</strong>:</p>
          <div class="token-row">
            <code class="token-code" id="token-value"></code>
            <button class="modal-btn-small" id="btn-copy-token">Copy</button>
          </div>
        </div>

        <button class="modal-btn modal-btn-success" id="btn-verify" style="display:none;">Verify Ownership</button>
        <button class="modal-btn modal-btn-danger" id="btn-logout" style="display:none;">Unlink Account</button>
        <button class="modal-btn modal-btn-secondary" id="btn-close-modal">Close</button>

        <div class="modal-message" id="verification-message" style="display:none;"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>BtrKorone v<span id="version">2.4.0</span></span>
      <span class="footer-sep">·</span>
      <a href="https://www.pekora.zip" target="_blank">Korone</a>
    </footer>
  </div>

  <script src="../shared/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
